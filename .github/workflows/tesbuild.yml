name: 🛠️ Tes

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: '🔗 Select Kernel Source'
        required: true
        default: 'custom'
        type: choice
        options:
          - custom
          - predator-strombreaker
          - san
          - snx

      CUSTOM_KERNEL_URL:
        description: '🔗 Custom Kernel Repository URL (required if source is "custom")'
        required: false
        type: string

      GH_TOKEN:
        description: '🔑 GitHub Access Token (required for the "custom" or "snx" source)'
        required: false
        type: string

      KERNEL_BRANCH:
        description: '🌿 Select Kernel Branch'
        required: true
        default: 'custom'
        type: choice
        options:
          - custom
          - oldcam
          - snx 1 (snx)
          - snx 2 (snx-ksu)

      CUSTOM_KERNEL_BRANCH:
        description: '🌿 Custom Branch Name (required if branch is "custom")'
        required: false
        type: string

      KERNEL_DEFCONFIG:
        description: '⚙️ Defconfig name (e.g. lavender_defconfig)'
        required: true
        type: string

      LOCALVERSION:
        description: '🏷️ Kernel name suffix (e.g. -MyKernel-v1.0)'
        required: false
        type: string

      DEFAULT_HOSTNAME:
        description: '💻 Kernel hostname (e.g. xiaomi@redmi)'
        required: true
        type: string

      BUILD_USER:
        description: '👤 Build username (e.g. xiaomi)'
        required: true
        type: string

      BUILD_HOST:
        description: '🖥️ Build host (e.g. redmi)'
        required: true
        type: string

      KERNEL_TWEAK:
        description: '🚀 Select performance profile'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - eas
          - eas-extreme
          - hmp
          - hmp-extreme

      INJECT_KSU:
        description: '🦊 Select KernelSU integration'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - xxKSU
          - KernelSU Next

      UBUNTU_VERSION:
        description: '🐧 Select Ubuntu runner version'
        required: true
        default: 'ubuntu-latest'
        type: choice
        options:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-20.04

      CLANG_SOURCE:
        description: '🧰 Select Clang toolchain source'
        required: true
        default: "custom"
        type: choice
        options:
          - custom
          - neutron
          - proton
          - azure
          - nexus

      CUSTOM_CLANG_URL:
        description: '📦 Custom Clang download link (required if toolchain is "custom")'
        required: false
        type: string

env:
  KERNEL_DIR: kernel_source
  CLANG_DIR: clang
  OUT_DIR: out
  ARCH: arm64
  SUBARCH: arm64
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.UBUNTU_VERSION }}
    permissions:
      contents: write

    steps:
      - name: 🔄 Checkout Repository
        uses: actions/checkout@v4

      - name: ⏱️ Record Build Start Time
        run: echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: 📦 Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison libssl-dev libelf-dev \
            build-essential python3 python3-pip curl git zip unzip wget ccache \
            libncurses-dev rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: ⚡ Setup Compiler Cache (ccache)
        run: |
          ccache --max-size=2G
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 💾 Restore Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.KERNEL_DEFCONFIG }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.KERNEL_DEFCONFIG }}-

      - name: 🔗 Resolve Kernel Source URL & Branch
        id: resolve-url-branch
        run: |
          AUTH_TOKEN="${{ inputs.GH_TOKEN }}"
          KERNEL_SRC="${{ inputs.KERNEL_SOURCE }}"
          KERNEL_BR="${{ inputs.KERNEL_BRANCH }}"

          if [ "$KERNEL_SRC" == "predator-strombreaker" ]; then
            echo "FINAL_KERNEL_URL=https://github.com/ExXyrou/predator_strombreaker_kernel" >> $GITHUB_ENV
          elif [ "$KERNEL_SRC" == "san" ]; then
            echo "FINAL_KERNEL_URL=https://github.com/ExXyrou/san_kernel" >> $GITHUB_ENV
          elif [ "$KERNEL_SRC" == "snx" ]; then
            if [ -z "$AUTH_TOKEN" ]; then
              echo "❌ ERROR: 'snx' is a private repository source, but your 'GH_TOKEN' input is empty!"
              echo "💡 Please provide a valid GitHub Personal Access Token (PAT) with repository access in the workflow input menu."
              exit 1
            fi
            echo "FINAL_KERNEL_URL=https://${AUTH_TOKEN}@github.com/ExXyrou/snx_kernel.git" >> $GITHUB_ENV
          else
            if [ -z "${{ inputs.CUSTOM_KERNEL_URL }}" ]; then
              echo "❌ ERROR: 'custom' source was selected, but CUSTOM_KERNEL_URL was left empty."
              exit 1
            fi

            if [ -n "$AUTH_TOKEN" ] && [[ "${{ inputs.CUSTOM_KERNEL_URL }}" == https://github.com/* ]]; then
              URL_WITHOUT_HTTPS=$(echo "${{ inputs.CUSTOM_KERNEL_URL }}" | sed 's|https://||')
              echo "FINAL_KERNEL_URL=https://${AUTH_TOKEN}@${URL_WITHOUT_HTTPS}" >> $GITHUB_ENV
            else
              echo "FINAL_KERNEL_URL=${{ inputs.CUSTOM_KERNEL_URL }}" >> $GITHUB_ENV
            fi
          fi

          case "$KERNEL_BR" in
            "custom")
              if [ -z "${{ inputs.CUSTOM_KERNEL_BRANCH }}" ]; then
                echo "❌ ERROR: 'custom' branch was selected, but CUSTOM_KERNEL_BRANCH was left empty."
                exit 1
              fi
              BRANCH_NAME="${{ inputs.CUSTOM_KERNEL_BRANCH }}"
              ;;
            "oldcam")
              BRANCH_NAME="oldcam"
              ;;
            *"snx 1"*)
              BRANCH_NAME="snx"
              ;;
            *"snx 2"*)
              BRANCH_NAME="snx-ksu"
              ;;
            *)
              BRANCH_NAME="$KERNEL_BR"
              ;;
          esac

          echo "FINAL_KERNEL_BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
          echo "✅ Resolved Source URL and Branch successfully."

      - name: 📢 Notify Telegram - Build Started
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MESSAGE=$(printf '🛠️ <b>LAVENDER KERNEL BUILD STARTED</b>\n━━━━━━━━━━━━━━━━━━━\n🔗 <b>Source:</b> %s\n🌿 <b>Branch:</b> %s\n⚙️ <b>Defconfig:</b> %s\n🚀 <b>Tweak:</b> %s\n🦊 <b>KSU:</b> %s\n🐧 <b>Runner:</b> %s\n👤 <b>Triggered by:</b> %s' \
            "${{ inputs.KERNEL_SOURCE }}" \
            "${{ env.FINAL_KERNEL_BRANCH }}" \
            "${{ inputs.KERNEL_DEFCONFIG }}" \
            "${{ inputs.KERNEL_TWEAK }}" \
            "${{ inputs.INJECT_KSU }}" \
            "${{ inputs.UBUNTU_VERSION }}" \
            "${{ github.actor }}")

          curl -s -X POST "https://api.telegram.org/bot8171609290:AAHLG3pBdv7BGZXJ6B1USXZvqYa4M-QeQb8/sendMessage" \
            --data-urlencode chat_id="-1003150231958" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="$MESSAGE" \
            --data-urlencode reply_markup="{\"inline_keyboard\":[[{\"text\":\"📄 View Logs\",\"url\":\"$RUN_URL\"}]]}"

      - name: 📥 Clone Kernel Source & Verify Token Access
        run: |
          echo "Testing repository access and cloning..."
          
          CLONE_CMD="git clone --depth=1"
          if [ -n "${{ env.FINAL_KERNEL_BRANCH }}" ]; then
            CLONE_CMD="$CLONE_CMD -b ${{ env.FINAL_KERNEL_BRANCH }}"
          fi
          
          if ! $CLONE_CMD "${{ env.FINAL_KERNEL_URL }}" "$KERNEL_DIR"; then
            echo ""
            echo "❌ ========================================================"
            echo "❌ ERROR: FAILED TO CLONE KERNEL SOURCE REPOSITORY!"
            echo "❌ ========================================================"
            echo "💡 Possible reasons:"
            echo "   1. The 'GH_TOKEN' provided is invalid, expired, or lacks permission."
            echo "   2. The repository is private and requires a token with 'repo' scope."
            echo "   3. The specified branch name ('${{ env.FINAL_KERNEL_BRANCH }}') does not exist."
            echo "❌ ========================================================"
            exit 1
          fi

          echo "========================================"
          echo "         KERNEL SOURCE DETAILS          "
          echo "========================================"
          git -C "$KERNEL_DIR" log -1 --oneline
          echo "========================================"

      - name: 🦊 Inject KernelSU
        if: ${{ inputs.INJECT_KSU != 'none' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ "${{ inputs.INJECT_KSU }}" == "xxKSU" ]; then
            echo "Injecting xxKSU..."
            curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
          elif [ "${{ inputs.INJECT_KSU }}" == "KernelSU Next" ]; then
            echo "Injecting KernelSU Next..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          fi

      - name: 🧰 Restore Clang Toolchain Cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: clang-${{ inputs.CLANG_SOURCE }}-${{ hashFiles('.github/workflows/*.yml') }}

      - name: ⬇️ Download Clang Compiler (Neutron)
        if: inputs.CLANG_SOURCE == 'neutron' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          curl -LSs "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" > antman
          chmod +x antman
          ./antman -S

      - name: ⬇️ Download Clang Compiler (Proton)
        if: inputs.CLANG_SOURCE == 'proton' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$CLANG_DIR"

      - name: ⬇️ Download Clang Compiler (Azure)
        if: inputs.CLANG_SOURCE == 'azure' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://gitlab.com/ImSpiDy/azure-clang.git "$CLANG_DIR"

      - name: ⬇️ Download Clang Compiler (Nexus)
        if: inputs.CLANG_SOURCE == 'nexus' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b nexus-14 https://gitlab.com/Project-Nexus/nexus-clang.git "$CLANG_DIR"

      - name: ⬇️ Download Custom Clang Compiler
        if: inputs.CLANG_SOURCE == 'custom' && steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "${{ inputs.CUSTOM_CLANG_URL }}" ]; then
            echo "❌ Error: 'custom' toolchain was selected, but CUSTOM_CLANG_URL was left empty."
            exit 1
          fi
          mkdir -p "$CLANG_DIR" && cd "$CLANG_DIR"
          if [[ "${{ inputs.CUSTOM_CLANG_URL }}" == *.git ]]; then
            git clone --depth=1 "${{ inputs.CUSTOM_CLANG_URL }}" .
          else
            curl -LSs "${{ inputs.CUSTOM_CLANG_URL }}" -o custom_clang.tar
            tar -xf custom_clang.tar || unzip custom_clang.tar
            rm -f custom_clang.tar
          fi

      - name: 🛠️ Fix DTC & Lexer Compilation Errors
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          if [ -f scripts/dtc/dtc-parser.tab.c ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-parser.tab.c
          fi

          if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
            sed -i \
              's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' \
              scripts/dtc/dtc-lexer.lex.c_shipped
          fi

      - name: ⚙️ Generate Kernel Configuration (Defconfig)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          make \
            O=$OUT_DIR \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            ${{ inputs.KERNEL_DEFCONFIG }}

      - name: 📝 Apply Performance Tweaks & Kernel Configs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"

          if [ ! -f scripts/config ]; then
            echo "❌ Error: scripts/config was not found in the kernel source."
            exit 1
          fi

          sed -i 's/CONFIG_DEFAULT_HOSTNAME=".*/CONFIG_DEFAULT_HOSTNAME="'"${{ inputs.DEFAULT_HOSTNAME }}"'"/' "$OUT_DIR/.config"
          if ! grep -q "CONFIG_DEFAULT_HOSTNAME=" "$OUT_DIR/.config"; then echo "CONFIG_DEFAULT_HOSTNAME=\"${{ inputs.DEFAULT_HOSTNAME }}\"" >> "$OUT_DIR/.config"; fi

          if [ -n "${{ inputs.LOCALVERSION }}" ]; then
            sed -i 's/CONFIG_LOCALVERSION=".*/CONFIG_LOCALVERSION="'"${{ inputs.LOCALVERSION }}"'"/' "$OUT_DIR/.config"
            if ! grep -q "CONFIG_LOCALVERSION=" "$OUT_DIR/.config"; then echo "CONFIG_LOCALVERSION=\"${{ inputs.LOCALVERSION }}\"" >> "$OUT_DIR/.config"; fi
          fi

          set_config() {
              local cfg="$1"
              local val="$2"
              if [ "$val" = "y" ]; then
                  ./scripts/config --file "$OUT_DIR/.config" --enable "$cfg"
              elif [ "$val" = "n" ]; then
                  ./scripts/config --file "$OUT_DIR/.config" --disable "$cfg"
              else
                  ./scripts/config --file "$OUT_DIR/.config" --set-val "$cfg" "$val"
              fi
          }

          enable_config() {
              ./scripts/config --file "$OUT_DIR/.config" --enable "$1"
          }

          disable_config() {
              ./scripts/config --file "$OUT_DIR/.config" --disable "$1"
          }

          if [ "${{ inputs.KERNEL_TWEAK }}" == "none" ]; then
            echo "ℹ️ Performance profile set to 'none'. Skipping optimizations."
          else
            echo "🔥 Applying Base Performance & Debug Profile..."
            disable_config CONFIG_DEBUG_INFO
            disable_config CONFIG_DEBUG_FS
            disable_config CONFIG_KASAN
            disable_config CONFIG_LOCKDEP
            enable_config CONFIG_JUMP_LABEL

            if [[ "${{ inputs.KERNEL_TWEAK }}" == *"-extreme" ]]; then
              echo "🌋 Applying EXTREME Performance Profile (1000Hz, Max Optimization)..."
              set_config CONFIG_HZ 1000
              enable_config CONFIG_HZ_1000
              disable_config CONFIG_HZ_300
              disable_config CONFIG_HZ_100
              disable_config CONFIG_DEBUG_KERNEL
              disable_config CONFIG_FTRACE
              disable_config CONFIG_PROFILING
              disable_config CONFIG_SCHED_DEBUG
              disable_config CONFIG_SLUB_DEBUG
              disable_config CONFIG_PM_DEBUG

              echo "🌋 Disabling Background Debugging & Latency Overhead..."
              enable_config CONFIG_PREEMPT
              disable_config CONFIG_PREEMPT_VOLUNTARY
              disable_config CONFIG_PREEMPT_NONE
              disable_config CONFIG_DEBUG_PREEMPT
              disable_config CONFIG_SCHEDSTATS
              disable_config CONFIG_SCHED_INFO
              disable_config CONFIG_DETECT_HUNG_TASK
              disable_config CONFIG_RCU_TRACE

              disable_config CONFIG_DEBUG_RT_MUTEXES
              disable_config CONFIG_DEBUG_SPINLOCK
              disable_config CONFIG_DEBUG_MUTEXES
              disable_config CONFIG_DEBUG_ATOMIC_SLEEP
              disable_config CONFIG_DEBUG_LIST
              disable_config CONFIG_DEBUG_PI_LIST
              disable_config CONFIG_DEBUG_SG
              disable_config CONFIG_DEBUG_NOTIFIERS

              disable_config CONFIG_MODULE_SIG
              disable_config CONFIG_MODULE_SIG_ALL
              disable_config CONFIG_MODULE_SIG_FORCE

              disable_config CONFIG_CC_OPTIMIZE_FOR_SIZE
              enable_config CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE

              disable_config CONFIG_KALLSYMS_ALL
            else
              echo "⚖️ Applying STABLE/DAILY Performance Profile (300Hz)..."
              set_config CONFIG_HZ 300
              enable_config CONFIG_HZ_300
              disable_config CONFIG_HZ_1000
              disable_config CONFIG_HZ_100
            fi

            if [[ "${{ inputs.KERNEL_TWEAK }}" == "eas"* ]]; then
              echo "⚡ Applying EAS Scheduler Tweaks..."
              enable_config CONFIG_SCHED_WALT
              enable_config CONFIG_ENERGY_MODEL
              enable_config CONFIG_CPU_FREQ_GOV_SCHEDUTIL
              enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
              disable_config CONFIG_CPU_FREQ_GOV_INTERACTIVE
              disable_config CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE
              set_config CONFIG_DEFAULT_GOVERNOR schedutil

            elif [[ "${{ inputs.KERNEL_TWEAK }}" == "hmp"* ]]; then
              echo "⚡ Applying HMP Scheduler Tweaks..."
              enable_config CONFIG_CPU_FREQ_GOV_INTERACTIVE
              enable_config CONFIG_CPU_FREQ_DEFAULT_GOV_INTERACTIVE
              disable_config CONFIG_SCHED_WALT
              disable_config CONFIG_ENERGY_MODEL
              disable_config CONFIG_CPU_FREQ_GOV_SCHEDUTIL
              disable_config CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL
              set_config CONFIG_DEFAULT_GOVERNOR interactive
            fi
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "xxKSU" ]; then
            echo "Configuring xxKSU..."
            enable_config CONFIG_KSU
            enable_config CONFIG_KSU_TAMPER_SYSCALL_TABLE
          fi

          if [ "${{ inputs.INJECT_KSU }}" == "xxKSU" ] || [ "${{ inputs.INJECT_KSU }}" == "KernelSU Next" ]; then
            echo "Enabling CONFIG_OVERLAY_FS for KernelSU..."
            enable_config CONFIG_OVERLAY_FS
          fi

          make \
            O=$OUT_DIR \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            olddefconfig

      - name: 🏗️ Build Kernel Image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -o pipefail
          
          if [ "${{ inputs.KERNEL_SOURCE }}" == "snx" ]; then
            echo "🧹 Cleaning up unsupported Polly flags for SNX source..."
            find . -name "Makefile*" -o -name "*.mk" | xargs sed -i 's/-mllvm -polly-opt-fusion=max//g'
            sed -i 's/-polly-opt-fusion=max//g' Makefile || true
          fi

          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/$CLANG_DIR/bin:$PATH"
          export ARCH=${{ env.ARCH }}
          export SUBARCH=${{ env.SUBARCH }}

          export HOSTCFLAGS="-fcommon -Wno-deprecated-declarations"
          export HOSTCXXFLAGS="-fcommon -Wno-deprecated-declarations"

          export KBUILD_BUILD_USER="${{ inputs.BUILD_USER }}"
          export KBUILD_BUILD_HOST="${{ inputs.BUILD_HOST }}"

          export KCFLAGS="-Wno-address -Wno-implicit-function-declaration"

          echo "========================================"
          echo "            COMPILING KERNEL...         "
          echo "========================================"

          make -j$(nproc --all) \
            O=$OUT_DIR \
            ARCH=${{ env.ARCH }} \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            HOSTCXX="ccache clang++" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CONFIG_LOCALVERSION_AUTO=n \
            KCFLAGS="$KCFLAGS" \
            2>&1 | tee build.log

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.KERNEL_DIR }}/build.log

      - name: 🔍 Locate Image & Package AnyKernel3 Zip
        id: img
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          BOOT_DIR="$PWD/$OUT_DIR/arch/arm64/boot"
          IMAGE=""

          for target in "Image.gz-dtb" "Image.gz" "Image"; do
            FOUND=$(find "$BOOT_DIR" -name "$target" 2>/dev/null | head -n1)
            if [ -n "$FOUND" ]; then
              IMAGE="$FOUND"
              break
            fi
          done

          if [ -z "$IMAGE" ]; then
            echo "❌ Error: No compiled kernel image was found in $BOOT_DIR"
            exit 1
          fi

          echo "image_path=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "✅ Kernel image located: $IMAGE"

          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/ExXyrou/kernel_flashable AnyKernel3
          cp "$IMAGE" AnyKernel3/

          INPUT_LOCALVER="${{ inputs.LOCALVERSION }}"
          FINAL_LOCALVER=""

          if [ -n "$INPUT_LOCALVER" ]; then
            FINAL_LOCALVER=$(echo "$INPUT_LOCALVER" | sed 's/^-//')
          else
            CONFIG_FILE="$GITHUB_WORKSPACE/$KERNEL_DIR/$OUT_DIR/.config"
            if [ -f "$CONFIG_FILE" ]; then
              FINAL_LOCALVER=$(grep "^CONFIG_LOCALVERSION=" "$CONFIG_FILE" | cut -d'"' -f2 | sed 's/^-//')
            fi
          fi

          if [ -z "$FINAL_LOCALVER" ]; then
            FINAL_LOCALVER="Unofficial"
          fi

          if [ -f "AnyKernel3/anykernel.sh" ]; then
            sed -i -E 's/^(kernel\.string=).*/\1'"$FINAL_LOCALVER"'/' AnyKernel3/anykernel.sh
            echo "✅ Updated kernel.string in anykernel.sh to: $FINAL_LOCALVER"
          fi

          mkdir -p AnyKernel3/modules/system/lib/modules AnyKernel3/patch AnyKernel3/ramdisk
          touch AnyKernel3/modules/system/lib/modules/placeholder AnyKernel3/patch/placeholder AnyKernel3/ramdisk/placeholder

          TIMESTAMP=$(date +'%Y%m%d')
          ZIP_NAME="Kernel-lavender-4.4${{ inputs.LOCALVERSION }}-${TIMESTAMP}.zip"
          echo "🏷️ Flashable Zip Name: $ZIP_NAME"

          cd AnyKernel3
          zip -r9 "$ZIP_NAME" * -x ".git/*"

          echo "zip_path=$GITHUB_WORKSPACE/AnyKernel3/$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "final_localver=$FINAL_LOCALVER" >> "$GITHUB_OUTPUT"
          echo "🚀 Flashable zip created successfully: $ZIP_NAME"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "#${{ github.run_number }}"
          name: "Kernel lavender 4.4${{ inputs.LOCALVERSION }}"
          body: |
            ### 📱 Redmi Note 7 Kernel Build
            - **Kernel Version:** 4.4${{ inputs.LOCALVERSION }}
            - **Performance Profile:** ${{ inputs.KERNEL_TWEAK }}
            - **KernelSU Variant:** ${{ inputs.INJECT_KSU }}
            - **Build Date:** `${{ steps.img.outputs.timestamp }}`
          files: ${{ steps.img.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Notify Telegram - Build Success
        if: success()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/latest"
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ env.BUILD_START_TIME }}))
          DURATION_STR="$((DURATION / 60))m $((DURATION % 60))s"

          MESSAGE=$(printf '✅ <b>KERNEL BUILD SUCCESSFUL</b>\n━━━━━━━━━━━━━━━━━━━\n📱 <b>Device:</b> Lavender (Redmi Note 7)\n🔗 <b>Source:</b> %s\n🌿 <b>Branch:</b> %s\n⚙️ <b>Defconfig:</b> %s\n🚀 <b>Profile:</b> %s\n🦊 <b>KSU:</b> %s\n📦 <b>File:</b> <code>%s</code>\n⏱️ <b>Duration:</b> %s\n👤 <b>Triggered by:</b> %s\n━━━━━━━━━━━━━━━━━━━\n🎉 Your kernel is ready to flash!' \
            "${{ inputs.KERNEL_SOURCE }}" \
            "${{ env.FINAL_KERNEL_BRANCH }}" \
            "${{ inputs.KERNEL_DEFCONFIG }}" \
            "${{ inputs.KERNEL_TWEAK }}" \
            "${{ inputs.INJECT_KSU }}" \
            "${{ steps.img.outputs.zip_name }}" \
            "$DURATION_STR" \
            "${{ github.actor }}")

